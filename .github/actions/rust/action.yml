name: Rust toolchain
description: Installs the pinned Rust toolchain, restores the build cache and installs Cargo tools.
inputs:
  components:
    description: Extra rustup components, comma separated.
    required: false
    default: ""
  tool:
    description: Cargo tools for install-action, comma separated.
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Install Rust
      shell: bash
      env:
        COMPONENTS: ${{ inputs.components }}
      run: |
        rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal ${COMPONENTS:+--component "$COMPONENTS"} --no-self-update
        rustup default "$RUST_TOOLCHAIN"
    - name: Restore build cache
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        workspaces: rust -> target
        save-if: ${{ github.ref == 'refs/heads/main' }}
    - name: Install Cargo tools
      if: inputs.tool != ''
      uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
      with:
        tool: ${{ inputs.tool }}
