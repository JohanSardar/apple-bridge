name: AppleBridge
options:
  bundleIdPrefix: com.johansardar.applebridge
  deploymentTarget:
    iOS: '26.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    DEVELOPMENT_TEAM: AX3C2B78YD
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: Apple Development
    PRODUCT_BUNDLE_IDENTIFIER: com.johansardar.applebridge.ios
    TARGETED_DEVICE_FAMILY: '1'
    GENERATE_INFOPLIST_FILE: NO
targets:
  AppleBridge:
    type: application
    platform: iOS
    sources: [App, Capabilities, Pairing, Delivery, ScreenTimeShared]
    dependencies:
      - target: AlarmActivity
        embed: true
      - target: ScreenTimeMonitor
      - target: ScreenTimeReport
    settings:
      base:
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/AppleBridge.entitlements
        APPLE_BRIDGE_APP_PROFILE: AB iOS Dev
        PROVISIONING_PROFILE_SPECIFIER: $(APPLE_BRIDGE_APP_PROFILE)
  AlarmActivity:
    type: app-extension
    platform: iOS
    sources: [AlarmActivity, Capabilities/Alarms/AlarmMetadata.swift]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.johansardar.applebridge.ios.alarms
        INFOPLIST_FILE: AlarmActivity/Info.plist
        PROVISIONING_PROFILE_SPECIFIER: $(ALARM_ACTIVITY_PROFILE)
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
  ScreenTimeMonitor:
    type: app-extension
    platform: iOS
    sources: [Extensions/ScreenTimeMonitor, ScreenTimeShared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.johansardar.applebridge.ios.screentimemonitor
        INFOPLIST_FILE: Extensions/ScreenTimeMonitor/Info.plist
        CODE_SIGN_ENTITLEMENTS: Extensions/ScreenTimeMonitor/ScreenTimeMonitor.entitlements
        PROVISIONING_PROFILE_SPECIFIER: $(AB_SCREENTIME_MONITOR_PROFILE_NAME)
        SKIP_INSTALL: YES
  ScreenTimeReport:
    type: app-extension
    platform: iOS
    sources: [Extensions/ScreenTimeReport]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.johansardar.applebridge.ios.screentimereport
        INFOPLIST_FILE: Extensions/ScreenTimeReport/Info.plist
        CODE_SIGN_ENTITLEMENTS: Extensions/ScreenTimeReport/ScreenTimeReport.entitlements
        PROVISIONING_PROFILE_SPECIFIER: $(AB_SCREENTIME_REPORT_PROFILE_NAME)
        SKIP_INSTALL: YES
