      - scenario: WEB-REM-PARITY
        level: real
        reason: "Images: image attachment readback passed previously, but fails with the leftover Edit Sections AXWindow active. Paste is issued with that separate editor still present, and no REMCDImageAttachment owned by the test reminder appears; the exact paste target is unverified."
    scenarios:
      - {id: WEB-REM-READ, levels: [web]}
      - {id: WEB-REM-DETAILS, levels: [web]}
      - {id: WEB-REM-WRITE, levels: [web, real]}
      - {id: WEB-REM-ENTRY, levels: [web]}
      - {id: WEB-REM-PARITY, levels: [sim, real, web]}
      - {id: WEB-REM-ACTIONS, levels: [web], status: dropped, reason: "Dropped by the owner: speed and idle-CPU budgets are out of scope; the feature's behavior is qualified separately."}
