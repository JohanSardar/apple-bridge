version: 1
levels:
  sim: Gateway, SimApplePeer and replicas on the Air; all Go, storage and network real
  real: Real Swift Helper and Apple apps on the Air
  replica: Real gateway on the Air, replica on the Ubuntu laptop
  agent: GPT-6-Luna via Codex on Ubuntu using only the replica MCP
  web: Playwright (WebKit, Chromium, Firefox) on the Air against a bridge-lab demo world, or the real gateway for real-level web runs
statuses: [todo, in_progress, done, limited, blocked]
status_rules:
  done: every scenario at every listed level has passing evidence
  limited: like done, except each entry in `limits` (scenario, level, reason) that cannot run for a reason outside the project's control, such as needing Johan's identity or credentials

requirements:
  R-LIVE: Changes on the Mac appear on every connected replica in under 1 s p95 while the Mac is awake
  R-FULL: Every replica converges to bridge state equal to Apple state within declared coverage
  R-RW: Every source that Apple lets the Mac change is writable through commands with evidence
  R-API: One REST API and one MCP server, identical on every machine
  R-SAFE-CMD: No ambiguous Apple effect is ever redispatched automatically; indeterminate is reported truthfully
  R-NO-FALSE-DELETE: Absence is published only after a complete scan; failures never look like empty data
  R-SCOPE: Scoped principals see nothing outside their scope through any path
  R-SECURE: Authenticated everywhere, paired devices, protected files and credentials
  R-RESILIENT: Crashes, partitions, restores, disk-full and clock jumps never corrupt or lose data
  R-ATTACH: Attachments download to every replica by default up to a per-machine cap
  R-MSG-DEPTH: Messages at full depth (send, files, reply, react, edit, unsend, read state, delete, groups)
  R-CAL: Calendar 2 years back to 2 years ahead, sliding daily, with recurrence and time zones
  R-REM: Reminders with lists, completion and recurrence
  R-CON: Contacts read and basic create/update/delete
  R-NOTES: Notes read and demonstrated plain-text writes; unsupported rich edits reject
  R-USAGE: Screen Time per app, per device, per day estimates, read-only
  R-PKG: Signed app with onboarding and background service; notarization optional, not required
  R-AGENT: A remote agent can do real tasks through MCP only
  R-WEB-UI: A web app mirrors Apple's apps per design/web specs, light and dark, phone and desktop, latest two Safari, Chrome/Edge and Firefox
  R-WEB-FAST: Interaction under 8 ms, 120 fps scrolling of 100k-message threads, Mac-to-browser p95 under 500 ms, warm load under 1 s
  R-WEB-REACH: Any browser or agent anywhere reaches the bridge through the embedded Funnel with nothing installed and nothing paid
  R-WEB-SECURE: Passkey device sessions, public-computer mode, revocation, origin and CSP protection, rate limits, agent levels with owner approval

