      - {id: WEB-RM-REMINDERS-LISTS, levels: [sim]}
      - {id: WEB-RM-REMINDERS-ITEMS, levels: [sim]}
      - {id: WEB-RM-REMINDERS-DEMO, levels: [sim]}
      - {id: REM-STORE-READ, levels: [sim, real]}
      - {id: REM-STORE-DECODE, levels: [sim]}
      - {id: REM-STORE-PERF, levels: [sim, real], status: dropped, reason: "Dropped by the owner: speed and idle-CPU budgets are out of scope; the feature's behavior is qualified separately."}
    notes: >-
      Core milestone green with explicit limits: browser 192/204 configured, with 12 not-applicable; all six phone projects prove trusted touch through the details and delete-cancel route. The focused actions matrix passes 72 cases with 12 layout exclusions and no failures or flakes. Quiet exclusive PERF-SHELL passes 12/12 after #303; Chromium navigation/input long tasks are absent and CLS is zero. Native first visibility passes 200/200, gateway/replica p95 560/563 ms; isolated create 372/386 ms and both forwarded deletes pass. Latest-update timing is descriptive only. Parity stays hidden pending native effect proof; real changed-set modes and app-specific UI timings remain limited. The signed Helper authorize-reminders path requested ordinary OS consent once; its report remained not_determined and a subsequent non-prompting status returned unknown while consent was unresolved. Status now includes automation_reminders. Parity commands have explicit unproven coverage and remain hidden; WEB-REM-PARITY checks captured read affordances and absent mutation controls. Gateway reminders.lists and reminders.items provide scoped counts, groups, sections, tags and recursive subtasks. The read-only web/1 UI renders the sidebar, sections and nested items, with completed visibility, sorts, search, details and live updates. Basic writes use trusted input events, identity-based optimistic reconciliation and completion motion; store-only parity remains limited. Views over 2 MiB fail explicitly; item paging remains a follow-up. Store WAL FSEvents hints and bounded burst coalescing supplement EventKit notifications after #267. The real flag-only gateway propagation check is limited until the Helper has Reminders Apple Events authorization. The native V2 UUID-array manual-order decoder is verified; early reminders, section blobs and custom filters remain unsupported pending positive fixtures at unlock. Native tags, attachment IDs, assignment and store alarm/recurrence projections also remain unsupported; EventKit alarms and recurrence stay available. F7 adds scoped native parity qualification and verified synthetic tag-change invalidation. The latest real run passes builds, flag set and clear, list icon, indent/outdent, tags, owned-list visibility, and regular and smart-list cleanup. Image attachment and sheet cleanup passed earlier but fail with the leftover section editor active. Section order and membership readback pass after decoding the native membership envelope and implicit creation-date order. Section reorder, reminder reorder, image attachment, smart-list creation, and sheet cleanup remain limited with their observed native control causes recorded above. No Location or notification permission was requested. Remaining store decoders and unverified parity mutations stay hidden.
