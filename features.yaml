      - {id: CON-READONLY-CONTAINER, levels: [sim]}
      - {id: CON-CONFLICT, levels: [sim]}
      - {id: CON-RESOLVE-RESTART, levels: [sim]}

    notes: >-
      Leader-accepted cold native Contacts CRUD on source 6f548790 based on main c2dcb28c: six native saves, gateway p95 528.632 ms and Ubuntu replica p95 563.151 ms over the LAN SSH tunnel, below the unchanged 1000 ms budget. The isolated 2026-10-23 public CON-RELAY rerun delivered all 20 native changes and six public commands; command replica p95 was 1788.080 ms against the unchanged 1000 ms budget. TCC activity surged during the run after a quiet precheck, so public write latency remains limited. Tagged cleanup passed. The immediate Serve byte comparison failed, but a later canonical configuration read matched the saved baseline.

