  - id: capture.commands
    title: Capture and PDF print provider lifecycle
    requirements: [R-API, R-SCOPE]
    milestone: G8
    modules: [native/Sources/CaptureSource]
    depends_on: [core.queries]
    status: done
    scenarios:
      - {id: CAP-SIM, levels: [sim, real]}
    notes: Camera capture is dropped from scope by the owner; camera provider coverage is retained in sim only. Capture providers fail closed without prompting. Real screenshot and screen recording require Screen Recording for the Helper; audio requires Microphone. Screenshot and screen video use ScreenCaptureKit; audio uses AVAudioRecorder. Named printers submit through the system print spooler. PDF output copies a validated PDF without UI. Evidence contains only digest, size, duration and dimensions.



