      - scenario: WEB-MSG-CHATS-STORE
        level: web
        reason: "Optional 100k-world cold-template setup is limited and deferred to the Messages milestone. A back-to-back origin/main versus head run in the same normal lane with APPLE_BRIDGE_HEAVY_NO_SIM_LANE=1 fails setup on both: main exceeds its unchanged 120-second dataset request bound; head reaches the unchanged six-minute cold bound before publication. No 100k entry exists to measure. The normal 5000-message prepared fixture passes WebKit/Chromium phone/desktop store and cache checks. LIVE-FIX owns the existing SQLite trigger-preparation ingestion cost; no thresholds changed."
