    limits:
      - scenario: MSG-GROUP-CREATE
        level: real
        reason: "2026-10-18 signed Helper and fresh AppleTruth probe: approved Remy/Ben pair offers Text Message • SMS only. Tagged SMS group text stayed in the composer after Enter; no group send or distinct iMessage group claimed. An iMessage group requires you plus at least two eligible others; no additional recipients authorized. See lab/evidence/messages-finish.json."
      - scenario: MSG-SEND-RCS-GROUP
        level: real
        reason: "2026-10-18 approved Remy/Ben pair offers SMS only in the fresh signed-Helper group probe. No RCS group send claimed. See lab/evidence/messages-finish.json."
      - scenario: MSG-GROUP-MANAGE
        level: real
        reason: "W4-GROUPS limited on macOS 26.7.1/25G241: Messages.sdef has no group-mutation route. Rename, photo, add/remove member and leave have no per-build Accessibility proof. A group made only of Johan's own handles cannot serve as an eligible distinct-participant proof; proving with others would text other people, forbidden by the hard rules. Native management stays fail-closed and its controls hidden; captured name, members and photo remain readable."
    scenarios:
