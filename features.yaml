  - id: web.reminders
    title: Reminders web app (read, write, parity)
    requirements: [R-WEB-UI, R-WEB-FAST, R-RW]
    milestone: W5
    modules: [webui, native/RemindersSource, native/RemindersStore, state, operations]
    depends_on: [web.frontdoor, reminders.write]
    status: in_progress
    scenarios:
      - {id: WEB-REM-READ, levels: [web]}
      - {id: WEB-REM-DETAILS, levels: [web]}
      - {id: WEB-REM-WRITE, levels: [web, real]}
      - {id: WEB-REM-ENTRY, levels: [web]}
      - {id: WEB-RM-REMINDERS-HARDENING, levels: [sim]}
      - {id: WEB-RM-REMINDERS-LISTS, levels: [sim]}
      - {id: WEB-RM-REMINDERS-ITEMS, levels: [sim]}
      - {id: WEB-RM-REMINDERS-DEMO, levels: [sim]}
      - {id: REM-STORE-READ, levels: [sim, real]}
      - {id: REM-STORE-DECODE, levels: [sim]}
      - {id: REM-STORE-PERF, levels: [sim, real]}
    notes: Gateway reminders.lists and reminders.items provide scoped counts, groups, sections, tags and recursive subtasks. The read-only web/1 UI renders the sidebar, sections and nested items, with completed visibility, sorts, search, details and live updates. Basic writes use trusted input events, identity-based optimistic reconciliation and completion motion; store-only parity remains limited. Views over 2 MiB fail explicitly; item paging remains a follow-up. Store-only flag, section and tag changes currently depend on EventKit notifications. The real flag-only gateway propagation check is limited until the Helper has Reminders Apple Events authorization; if no notification arrives, follow up with a WAL FSEvents hint through the existing bounded coalescer. The native V2 UUID-array manual-order decoder is verified; early reminders, section blobs and custom filters remain unsupported pending positive fixtures at unlock. Native tags, attachment IDs, assignment and store alarm/recurrence projections also remain unsupported; EventKit alarms and recurrence stay available. Remaining store decoders and unverified parity mutations stay hidden.
