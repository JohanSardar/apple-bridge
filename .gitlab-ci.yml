workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

default:
  image: rust:1-bookworm
  interruptible: true
  before_script:
    - rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal ${RUST_COMPONENTS:+--component "$RUST_COMPONENTS"} --no-self-update
    - rustup default "$RUST_TOOLCHAIN"
  cache:
    key: rust-$CI_JOB_NAME_SLUG
    paths:
      - rust/target/
      - .cargo-home/registry/
    policy: pull-push

variables:
  RUST_TOOLCHAIN: "1.99.1"
  CARGO_BUILD_JOBS: "4"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  CARGO_TARGET_DIR: $CI_PROJECT_DIR/rust/target
  CARGO_HOME: $CI_PROJECT_DIR/.cargo-home
  NEXTEST_VERSION: "0.9.151"
  CARGO_DENY_VERSION: "0.20.2"

gates:
  timeout: 30m
  variables:
    RUST_COMPONENTS: rustfmt
  script:
    - curl -fsSL "https://github.com/EmbarkStudios/cargo-deny/releases/download/$CARGO_DENY_VERSION/cargo-deny-$CARGO_DENY_VERSION-x86_64-unknown-linux-musl.tar.gz" | tar -xz --strip-components=1 -C /usr/local/bin "cargo-deny-$CARGO_DENY_VERSION-x86_64-unknown-linux-musl/cargo-deny"
    - rust/check.sh fmt --all -- --check
    - make lint
    - make features
    - make rust-lab-independence
    - python3 rust/check-native-graph.py
    - rust/check.sh deny check

clippy:
  timeout: 60m
  variables:
    RUST_COMPONENTS: clippy
  script:
    - rust/check.sh clippy --workspace --all-targets --locked -- -D warnings
    - rust/check.sh clippy -p ab-session --all-targets --locked -- -D warnings
    - rust/check.sh clippy -p ab-session --features lab --all-targets --locked -- -D warnings

tests:
  timeout: 90m
  script:
    - curl -fsSL "https://get.nexte.st/$NEXTEST_VERSION/linux" | tar -xz -C /usr/local/bin
    - rust/check.sh nextest run --profile ci --workspace --locked
    - rust/check.sh nextest run --profile ci -p ab-session --locked
    - rust/check.sh nextest run --profile ci -p ab-session --features lab --locked
    - rust/check.sh test --workspace --locked --doc

search-update:
  timeout: 45m
  variables:
    CARGO_PROFILE_RELEASE_LTO: "off"
    CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
    CARGO_PROFILE_RELEASE_STRIP: "none"
  script:
    - make rust-search-perf
