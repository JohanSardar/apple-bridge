[package]
name = "ab-spike-s4-s6"
version = "0.1.0"
edition = "2024"
license = "MIT"


[dependencies]
rmcp = { version = "=3.8.0", default-features = false, features = ["server", "client", "transport-streamable-http-server", "transport-streamable-http-client-reqwest"] }
webauthn-rs-core = "=0.6.2"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
axum = "0.8"
url = "2"
base64 = "0.22"
serde_cbor_2 = "0.13"

[workspace]

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "deny"
unused_must_use = "deny"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
