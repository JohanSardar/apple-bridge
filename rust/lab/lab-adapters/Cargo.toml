[package]
name = "lab-adapters"
version.workspace = true
edition.workspace = true
license.workspace = true
[lints]
workspace = true
[[bin]]
name = "lab-families"
path = "src/main.rs"
[dependencies]
lab-world = { path = "../lab-world" }
lab-runner = { path = "../lab-runner" }
lab-wire = { path = "../lab-wire" }
lab-demo = { path = "../lab-demo" }
lab-relay = { path = "../lab-relay" }
jiff.workspace = true
serde_json.workspace = true
sha2.workspace = true
hex = "0.4"
serde-saphyr = "2.1"
miniz_oxide = "0.9"
crc32fast = "1"
zune-png = "0.5"
zune-jpeg = "0.5.16-rc3"
zune-core = "0.5"
rusqlite.workspace = true
aes-gcm = "0.10"
base64 = "0.22"
data-encoding = "2"
ed25519-dalek.workspace = true
x25519-dalek = { workspace = true, features = ["static_secrets"] }
hmac = "0.12"
socket2 = "0.6"
rcgen = "0.14"
rustls.workspace = true
p256 = { version = "0.14", features = ["ecdsa", "pkcs8"] }
tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }
x509-parser = "0.18"
