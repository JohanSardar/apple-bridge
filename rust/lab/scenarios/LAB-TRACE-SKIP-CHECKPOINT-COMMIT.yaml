              "reminders"
            ],
            "sources": [
              "reminders"
            ]
          }
        ],
        "mutant": [
          {
            "event": "owner",
            "fence": 1
          },
          {
            "event": "accepted",
            "fence": 1
          },
          {
            "event": "commit",
            "checkpoint": "cp1"
          },
          {
            "event": "ack",
            "checkpoint": "cp1"
          },
          {
            "event": "reopen",
            "checkpoint": ""
          }
        ]
      }
    }
  ]
