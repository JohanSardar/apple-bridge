[workspace]
resolver = "3"
members = ["crates/*", "tools/*", "spikes", "lab/lab-*"]

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.2"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
debug_assert_with_mut_call = "deny"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
module_name_repetitions = "allow"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
jiff = "0.2"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
axum = "0.8"
hyper = { version = "1", features = ["full"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rusqlite = { version = "=0.41.1", features = ["bundled"] }
libsqlite3-sys = "=0.39.0"
rmcp = { version = "=3.8.0", default-features = false, features = ["server", "transport-streamable-http-server"] }
ed25519-dalek = "2"
x25519-dalek = "2"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.spike-budget]
inherits = "dev"

[patch.crates-io]
webauthn-rs-core = { path = "vendor/webauthn-rs-core" }
crypto-glue = { path = "vendor/crypto-glue" }

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
