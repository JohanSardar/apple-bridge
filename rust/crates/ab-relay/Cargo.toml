[package]
name = "ab-relay"
version.workspace = true
edition.workspace = true
license.workspace = true
[lints]
workspace = true
[dependencies]
ab-wire = { path = "../ab-wire" }
ring = "0.17"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
sha2.workspace = true
ed25519-dalek.workspace = true
jiff.workspace = true
tokio.workspace = true
axum = { workspace = true, features = ["ws"] }
rustls.workspace = true
base64 = "0.22"
getrandom = "0.3"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-util = { version = "0.7", features = ["rt"] }
futures-util = "0.3"
hyper-util = { version = "0.1", features = ["server-auto", "tokio", "service"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "http2"] }
hickory-resolver = "0.26"
humantime = "2"
tower = { version = "0.5", features = ["make", "util"] }
instant-acme = { version = "=0.8.5", default-features = false, features = ["ring", "hyper-rustls"] }
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
sec1 = { version = "0.7", features = ["pem", "std"] }
pkcs8 = { version = "0.10", features = ["pem", "std"] }
x509-parser = "0.18"

[dev-dependencies]
ab-remote = { path = "../ab-remote" }
