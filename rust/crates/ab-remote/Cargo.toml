[package]
name = "ab-remote"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
ab-wire = { path = "../ab-wire" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
rustls.workspace = true
sha2.workspace = true
ed25519-dalek.workspace = true
base64 = "0.22"
rand = "0.8"
fs2 = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
futures-util = { version = "0.3", features = ["sink"] }
instant-acme = { version = "0.8.5", default-features = false, features = ["hyper-rustls", "ring"] }
rcgen = { version = "0.14", default-features = false, features = ["pem", "ring"] }
x509-parser = "0.18"
sec1 = { version = "0.7", features = ["pem", "std"] }
pkcs8 = { version = "0.10", features = ["pem", "std"] }

[dev-dependencies]
tempfile = "3"

[features]
default = []
r2-certificates = []

[[test]]
name = "relay_ct_independent"
required-features = ["r2-certificates"]
