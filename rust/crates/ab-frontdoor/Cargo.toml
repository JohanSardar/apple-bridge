[package]
name = "ab-frontdoor"
version.workspace = true
edition.workspace = true
license.workspace = true
[lints]
workspace = true
[dependencies]
ab-trust = { path = "../ab-trust" }
ab-pages = { path = "../ab-pages" }
cookie = "0.18"
url = "2"
jiff.workspace = true
ipnet = "2"
httpdate = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "blocking", "json"] }
ab-operations = { path = "../ab-operations" }
ab-catalog = { path = "../ab-catalog" }
axum.workspace = true
rmcp.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
thiserror.workspace = true
tower = { version = "0.5", features = ["util"] }
base64 = "0.22"
futures-util = "0.3"

[dev-dependencies]
tempfile = "3"
sha2.workspace = true

[features]
lab-harness = ["ab-trust/lab-harness", "ab-operations/lab-harness"]
lab-queries = ["ab-operations/lab-harness"]
