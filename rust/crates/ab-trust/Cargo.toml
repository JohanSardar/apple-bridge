[package]
name = "ab-trust"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
ab-domain = { path = "../ab-domain" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
sha2.workspace = true
ab-wire = { path = "../ab-wire" }
ab-sys = { path = "../ab-sys" }
rustls.workspace = true
ed25519-dalek = { workspace = true, features = ["pkcs8", "pem"] }
jiff.workspace = true
base64 = "0.22"
data-encoding = "2"
hmac = "0.12"
oauth2 = { version = "5", default-features = false }
subtle = "2"
rand = "0.8"
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
x509-parser = "0.18"
fs2 = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
hex = "0.4"
tokio.workspace = true
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
hyper.workspace = true
hyper-util = { version = "0.1", features = ["tokio", "server", "http1"] }
http-body-util = "0.1"
time = "0.3"
ulid = "1"
url = "2"
webauthn-rs-core = "=0.6.2"
serde_cbor_2 = "0.13"

rusqlite.workspace = true

[features]
lab-harness = ["ab-domain/lab"]

[dev-dependencies]
tempfile = "3"
