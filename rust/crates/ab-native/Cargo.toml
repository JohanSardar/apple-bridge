[package]
name = "ab-native"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
ab-domain = { path = "../ab-domain" }
ab-wire = { path = "../ab-wire" }
serde.workspace = true
serde_json = { workspace = true, features = ["float_roundtrip"] }
sha2.workspace = true
thiserror.workspace = true
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
rusqlite.workspace = true
jiff.workspace = true
plist = { version = "=1.10.3", default-features = false, features = ["enable_unstable_features_that_may_break_with_minor_version_bumps"] }

base64 = "=0.22.1"
libc = "0.2"
