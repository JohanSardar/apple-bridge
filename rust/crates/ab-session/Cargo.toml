[package]
name = "ab-session"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
default = []
lab = ["ab-wire/lab"]
rust-effects = ["dep:sha2", "rust-capture"]
rust-capture = ["dep:ab-native", "dep:sha2", "dep:base64"]

[dependencies]
ab-native = { path = "../ab-native", optional = true }
ab-sys = { path = "../ab-sys" }
ab-wire = { path = "../ab-wire" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

sha2 = { workspace = true, optional = true }
base64 = { version = "=0.22.1", optional = true }
jiff.workspace = true

[dev-dependencies]
ab-state = { path = "../ab-state" }
rusqlite.workspace = true
