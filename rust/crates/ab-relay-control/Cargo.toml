[package]
name = "ab-relay-control"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Links a person's Macs to a relay and manages their tunnels. Identity comes from Better Auth. It has no route to Mac data."

[lints]
workspace = true

[features]
default = []
r2-certificates = []

[[bin]]
name = "ab-relay-control"
path = "src/main.rs"

[dependencies]
ab-pages = { path = "../ab-pages" }
ab-wire = { path = "../ab-wire" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
sha2.workspace = true
rusqlite.workspace = true
tokio.workspace = true
axum.workspace = true
ed25519-dalek.workspace = true
base64 = "0.22"
getrandom = "0.3"
fs2 = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
url = "2"
jiff.workspace = true

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
ed25519-dalek = { workspace = true, features = ["rand_core"] }

[[test]]
name = "relay_caa_account"
required-features = ["r2-certificates"]
