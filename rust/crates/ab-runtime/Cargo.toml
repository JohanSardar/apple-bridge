[package]
name = "ab-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
[lints]
workspace = true
[dependencies]
ab-commands = { path = "../ab-commands" }
ab-shortcuts = { path = "../ab-shortcuts" }
ab-iphone = { path = "../ab-iphone" }
ab-catalog = { path = "../ab-catalog" }
ab-applepeer = { path = "../ab-applepeer" }
clap = { version = "4", features = ["derive", "env"] }
rand = "0.8"
data-encoding = "2"
rustls.workspace = true
hyper.workspace = true
http-body = "1"
hyper-util = { version = "0.1", features = ["tokio", "service"] }
tower = { version = "0.5", features = ["util"] }
ab-remote = { path = "../ab-remote" }
ab-operations = { path = "../ab-operations" }
ab-frontdoor = { path = "../ab-frontdoor" }
ab-wire = { path = "../ab-wire" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
axum.workspace = true
sha2.workspace = true
libc = "0.2"
ab-sys = { path = "../ab-sys" }
ab-state = { path = "../ab-state" }
ab-trust = { path = "../ab-trust" }
ab-replication = { path = "../ab-replication", optional = true }
ab-blobs = { path = "../ab-blobs" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

jiff.workspace = true
rusqlite.workspace = true
qrcode = { version = "0.14", default-features = false }
unicode-width = "0.2"

[features]
lab-queries = ["lab-harness", "ab-frontdoor/lab-queries"]
seeded-faults = ["lab-harness", "ab-operations/seeded-faults", "ab-applepeer/seeded-faults"]
lab-harness = ["ab-remote/lab-harness", "ab-replication?/lab-harness", "ab-state/lab", "ab-frontdoor/lab-harness", "ab-frontdoor/lab-queries", "ab-operations/lab-harness", "ab-iphone/lab-harness"]
default = ["replica-feed"]
replica-feed = ["dep:ab-replication"]

[[example]]
name = "frontdoor_fixture"
required-features = ["replica-feed", "lab-harness"]

[dev-dependencies]
futures-util = "0.3"
ab-session = { path = "../ab-session" }
lab-demo = { path = "../../lab/lab-demo" }
tempfile = "3"

[target.'cfg(target_os = "linux")'.dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
