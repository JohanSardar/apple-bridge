[package]
name = "ab-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
[lints]
workspace = true
[dependencies]
ab-commands = { path = "../ab-commands" }
ab-iphone = { path = "../ab-iphone" }
ab-catalog = { path = "../ab-catalog" }
ab-applepeer = { path = "../ab-applepeer" }
rand = "0.8"
data-encoding = "2"
rustls.workspace = true
hyper.workspace = true
hyper-util = { version = "0.1", features = ["tokio", "service"] }
tower = { version = "0.5", features = ["util"] }
webpki-roots = "1"
subtle = "2"
ab-remote = { path = "../ab-remote" }
ab-operations = { path = "../ab-operations" }
ab-frontdoor = { path = "../ab-frontdoor" }
ab-wire = { path = "../ab-wire" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
axum.workspace = true
sha2.workspace = true
ab-state = { path = "../ab-state" }
ab-trust = { path = "../ab-trust" }
ab-replication = { path = "../ab-replication", optional = true }
ab-blobs = { path = "../ab-blobs" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

jiff.workspace = true
rusqlite.workspace = true

[features]
r2-certificates = ["ab-remote/r2-certificates"]
lab-queries = ["lab-harness", "ab-frontdoor/lab-queries"]
seeded-faults = ["lab-harness", "ab-operations/seeded-faults", "ab-applepeer/seeded-faults"]
lab-harness = ["ab-remote/lab-harness", "ab-replication?/lab-harness", "ab-state/lab", "ab-frontdoor/lab-harness", "ab-frontdoor/lab-queries", "ab-operations/lab-harness"]
default = ["replica-feed"]
replica-feed = ["dep:ab-replication"]

[[example]]
name = "frontdoor_fixture"
required-features = ["replica-feed", "lab-harness"]
